name = "homestand-api"
main = "src/worker/index.ts"
compatibility_date = "2026-10-01"

# Never upload source maps with the Worker.
upload_source_maps = false

# Picks the real (private) or synthetic reference data before wrangler bundles the Worker. Runs on `wrangler deploy` and `wrangler dev`.
[build]
command = "node scripts/prepare-data.mjs"

# Counters and per-client gates live in one SQLite-backed Durable Object (src/worker/counters-do.ts): atomic increments, and none of KV's
# 1,000-writes-a-day free limit. The first deploy applies the migration below on its own. KV keeps only saved results.
[[durable_objects.bindings]]
name = "COUNTERS"
class_name = "Counters"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Counters"]

[ai]
binding = "AI"

# Pre-warm (src/worker/warm.ts): every 3 hours, up to 8 new towns from the list of the largest US and Canadian metros, within the free-plan
# KV write budget and 40% of the day's Qloo allowance. Towns already saved cost nothing. Not inherited by [env.check] (no cron locally).
[triggers]
crons = ["17 */3 * * *"]

# KV cache for Qloo results, daily counters and rate limits. The id is a placeholder: the ship step creates the
# namespace (through ~/RamenProtocol/_ops/infra/ramen-deploy.sh) and replaces it. Never run a bare `wrangler deploy`.
[[kv_namespaces]]
binding = "CACHE"
id = "4447d78d27ae4134966ec9bac7984b85"

# Per-client request limits per minute (Cloudflare Rate Limiting binding; period must be 10 or 60). Keys are hashed client ids,
# an IPv6 caller counting as its /64. These mirror LIMITS in src/worker/limits.ts. Not inherited by [env.check], which sets its own.
[[ratelimits]]
name = "LIMIT_GEOCODE"
namespace_id = "41001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "LIMIT_ANALYZE"
namespace_id = "41002"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "LIMIT_PROPOSE"
namespace_id = "41003"
simple = { limit = 40, period = 60 }

[[ratelimits]]
name = "LIMIT_RECHECK"
namespace_id = "41004"
simple = { limit = 15, period = 60 }

[[ratelimits]]
name = "LIMIT_HEALTH"
namespace_id = "41005"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "LIMIT_MCP"
namespace_id = "41006"
simple = { limit = 60, period = 60 }

# One constant key each (src/worker/index.ts): a ceiling on live new-city pulls and on model calls for everyone together, per minute, so a few
# addresses cannot drain the daily Qloo and model caps in minutes.
[[ratelimits]]
name = "LIMIT_GLOBAL_PULL"
namespace_id = "41007"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "LIMIT_GLOBAL_MODEL"
namespace_id = "41008"
simple = { limit = 30, period = 60 }

# Production. Secrets (not here): QLOO_API_KEY and MARKET_SIGNING_KEY (any random string of 16+ characters; without it only the
# sample clubs work). Non-secret values only.
[vars]
ALLOWED_ORIGINS = "https://homestand-6az.pages.dev"
QLOO_API_URL = "https://hackathon.api.qloo.com"
QLOO_DAILY_CAP = "1500"
AI_DAILY_CAP = "400"

# Local runs and e2e: `npm run worker:dev`. No AI binding (the agent writes template text) and synthetic Qloo
# answers (QLOO_MODE=synthetic), so it needs no login and makes no network call to Qloo.
# (No [ai] here on purpose: wrangler warns that "ai" is not inherited. That is the point.)
[env.check]
[env.check.vars]
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173,http://127.0.0.1:5199"
QLOO_API_URL = "https://hackathon.api.qloo.com"
QLOO_MODE = "synthetic"
# A fixed, non-secret key: local runs and e2e only. Production sets its own secret.
MARKET_SIGNING_KEY = "local-dev-signing-key-not-a-secret"
QLOO_DAILY_CAP = "400"
AI_DAILY_CAP = "400"

[[env.check.kv_namespaces]]
binding = "CACHE"
id = "00000000000000000000000000000000"

# Local runs and e2e get roomy limits so a whole test run does not trip them.
[[env.check.ratelimits]]
name = "LIMIT_GEOCODE"
namespace_id = "41011"
simple = { limit = 600, period = 60 }

[[env.check.ratelimits]]
name = "LIMIT_ANALYZE"
namespace_id = "41012"
simple = { limit = 600, period = 60 }

[[env.check.ratelimits]]
name = "LIMIT_PROPOSE"
namespace_id = "41013"
simple = { limit = 600, period = 60 }

[[env.check.ratelimits]]
name = "LIMIT_RECHECK"
namespace_id = "41014"
simple = { limit = 600, period = 60 }

[[env.check.ratelimits]]
name = "LIMIT_HEALTH"
namespace_id = "41015"
simple = { limit = 600, period = 60 }

[[env.check.ratelimits]]
name = "LIMIT_MCP"
namespace_id = "41016"
simple = { limit = 600, period = 60 }

[[env.check.durable_objects.bindings]]
name = "COUNTERS"
class_name = "Counters"
